services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DoomRuContext: "Host=db;Port=5432;Database=doomru;Username=doomru;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ApiSettings__ApiKey: "${AI_API_KEY:-}"
      HttpsRedirection__Enabled: "false"
      DataProtection__KeysPath: /app/keys
    volumes:
      - app-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: doomru
      POSTGRES_USER: doomru
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomru -d doomru"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  app-keys:
